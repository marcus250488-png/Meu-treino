name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos KEYSTORE_BASE64 e/ou KEYSTORE_PASSWORD. Sem eles o APK sairia com chave de debug e não instalaria por cima do app atual."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meutreino.jks

      - name: Analisar código
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Mostrar SHA-1 da assinatura do APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "=== ASSINATURA DO APK (copie o SHA-1 abaixo para o Firebase) ==="
          "$AS" verify --print-certs "$APK" | grep -i "SHA-1" || true
          keytool -printcert -jarfile "$APK" | grep -i "SHA1" || true

      - name: Package project source
        run: git archive --format=zip --output Meu_Treino_projeto.zip HEAD

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: meu-treino-projeto-fonte
          path: Meu_Treino_projeto.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-treino-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
